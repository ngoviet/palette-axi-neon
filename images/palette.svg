<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <radialGradient id="bg" cx="0" cy="0" r="1.4">
      <stop offset="0" stop-color="#142443"/>
      <stop offset="0.55" stop-color="#0a1122"/>
      <stop offset="1" stop-color="#060a14"/>
    </radialGradient>
  </defs>
  <rect width="880" height="420" rx="20" fill="url(#bg)"/>

  <text x="32" y="50" fill="#e6edf7" font-size="24" font-weight="600">Palette AXI Neon</text>
  <text x="32" y="76" fill="#a2b7d7" font-size="14">Night-blue surfaces · accents on one lightness band · one meaning per colour</text>

  <!-- Surfaces -->
  <rect x="32" y="100" width="388" height="140" rx="18" fill="#0e182e" stroke="#1e2b4a"/>
  <text x="52" y="128" fill="#a2b7d7" font-size="12" letter-spacing="1">SURFACES &amp; TEXT</text>
  <g font-size="12">
    <rect x="52" y="142" width="60" height="44" rx="10" fill="#060a14" stroke="#1e2b4a"/>
    <text x="52" y="204" fill="#e6edf7">#060a14</text><text x="52" y="220" fill="#6b7fa3">sidebar</text>
    <rect x="124" y="142" width="60" height="44" rx="10" fill="#0a1122" stroke="#1e2b4a"/>
    <text x="124" y="204" fill="#e6edf7">#0a1122</text><text x="124" y="220" fill="#6b7fa3">page</text>
    <rect x="196" y="142" width="60" height="44" rx="10" fill="#0e182e" stroke="#2c3d63"/>
    <text x="196" y="204" fill="#e6edf7">#0e182e</text><text x="196" y="220" fill="#6b7fa3">card</text>
    <rect x="268" y="142" width="60" height="44" rx="10" fill="#142443" stroke="#1e2b4a"/>
    <text x="268" y="204" fill="#e6edf7">#142443</text><text x="268" y="220" fill="#6b7fa3">input</text>
    <rect x="340" y="142" width="60" height="44" rx="10" fill="#1e2b4a"/>
    <text x="340" y="204" fill="#e6edf7">#1e2b4a</text><text x="340" y="220" fill="#6b7fa3">border</text>
  </g>

  <!-- Text sample card -->
  <rect x="440" y="100" width="408" height="140" rx="18" fill="#0e182e" stroke="#1e2b4a"/>
  <text x="460" y="128" fill="#a2b7d7" font-size="12" letter-spacing="1">CONTRAST ON THE CARD</text>
  <text x="460" y="162" fill="#e6edf7" font-size="18" font-weight="600">Primary text  #e6edf7</text>
  <text x="740" y="162" fill="#e6edf7" font-size="14">14.99:1</text>
  <text x="460" y="190" fill="#a2b7d7" font-size="16">Secondary text  #a2b7d7</text>
  <text x="740" y="190" fill="#a2b7d7" font-size="14">8.66:1</text>
  <rect x="460" y="204" width="132" height="26" rx="13" fill="#22d3ee"/>
  <text x="526" y="222" fill="#0a1122" font-size="13" font-weight="600" text-anchor="middle">Button  10.41:1</text>
  <rect x="604" y="204" width="226" height="26" rx="6" fill="#142443"/>
  <text x="616" y="222" fill="#e6edf7" font-size="13">Text field  13.07:1</text>

  <!-- Accents -->
  <rect x="32" y="260" width="816" height="132" rx="18" fill="#0e182e" stroke="#1e2b4a"/>
  <text x="52" y="288" fill="#a2b7d7" font-size="12" letter-spacing="1">ACCENTS — WCAG CONTRAST ON THE CARD</text>
  <g font-size="12">
    <circle cx="92" cy="326" r="22" fill="#22d3ee"/>
    <text x="92" y="364" fill="#e6edf7" text-anchor="middle">primary</text><text x="92" y="380" fill="#6b7fa3" text-anchor="middle">#22d3ee · 9.8</text>
    <circle cx="192" cy="326" r="22" fill="#22c55e"/>
    <text x="192" y="364" fill="#e6edf7" text-anchor="middle">good</text><text x="192" y="380" fill="#6b7fa3" text-anchor="middle">#22c55e · 7.8</text>
    <circle cx="292" cy="326" r="22" fill="#fbbf24"/>
    <text x="292" y="364" fill="#e6edf7" text-anchor="middle">attention</text><text x="292" y="380" fill="#6b7fa3" text-anchor="middle">#fbbf24 · 10.6</text>
    <circle cx="392" cy="326" r="22" fill="#ff716a"/>
    <text x="392" y="364" fill="#e6edf7" text-anchor="middle">error</text><text x="392" y="380" fill="#6b7fa3" text-anchor="middle">#ff716a · 6.6</text>
    <circle cx="492" cy="326" r="22" fill="#6ca4ff"/>
    <text x="492" y="364" fill="#e6edf7" text-anchor="middle">info</text><text x="492" y="380" fill="#6b7fa3" text-anchor="middle">#6ca4ff · 7.1</text>
    <circle cx="592" cy="326" r="22" fill="#a78bfa"/>
    <text x="592" y="364" fill="#e6edf7" text-anchor="middle">purple</text><text x="592" y="380" fill="#6b7fa3" text-anchor="middle">#a78bfa · 6.5</text>
    <circle cx="692" cy="326" r="22" fill="#fb923c"/>
    <text x="692" y="364" fill="#e6edf7" text-anchor="middle">orange</text><text x="692" y="380" fill="#6b7fa3" text-anchor="middle">#fb923c · 7.8</text>
    <circle cx="792" cy="326" r="22" fill="#f472b6"/>
    <text x="792" y="364" fill="#e6edf7" text-anchor="middle">pink</text><text x="792" y="380" fill="#6b7fa3" text-anchor="middle">#f472b6 · 6.7</text>
  </g>
</svg>
